# Server Configuration
server.port=8080

# PostgreSQL Datasource Configuration via Environment Variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniguide}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
# initialization-fail-timeout = -1 prevents startup failures when PostgreSQL database is not yet created/connected
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
